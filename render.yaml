services:
  - type: web
    name: phd-thesis
    runtime: docker
    plan: starter
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    buildCommand: echo "Using Docker build - Python version controlled by Dockerfile"
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: PORT
        value: "8080"
    healthCheckPath: /
    numInstances: 1
    autoDeploy: true
