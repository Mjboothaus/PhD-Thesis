# Render Blueprint — https://render.com/docs/blueprint-spec
# Docker runtime: Python version comes from Dockerfile (3.14), not PYTHON_VERSION.
services:
  - type: web
    name: phd-thesis
    runtime: docker
    plan: starter
    region: oregon
    branch: main
    rootDir: .
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Docker builds do not use buildCommand; kept as a no-op for clarity
    autoDeploy: true
    healthCheckPath: /_stcore/health
    numInstances: 1
    envVars:
      - key: PORT
        value: "8080"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: STREAMLIT_SERVER_HEADLESS
        value: "true"
      - key: STREAMLIT_BROWSER_GATHER_USAGE_STATS
        value: "false"
