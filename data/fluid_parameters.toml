# Single source of truth for fluid thermodynamic + potential parameters.
# Loaded by charged_fluids.parameters (do not duplicate in Python dicts).

[kcl]
name = "Potassium Chloride"
symbol = "kcl"
component = ["K", "Cl"]
valence = [1.0, -1.0]
temperature = 1075.0
concentration = [19.5, 19.5]
epsilon_r = 1.0
index = 1
cr_filename = "kcl.cr.dat"  # resolved via data/bulk/ first (legacy dump retained under data/)
status = "experimental"  # Ng/PY bulk c_short available; g(r) residual still elevated

[kcl.potential]
type = "ionic"
n_outer_shell = [8.0, 8.0]
# alpha = 1 / 0.337 inverse angstrom
alpha = 2.967359050445104
b = 3.38e-20
sigma = [1.463, 1.585]
# Historical values were stored as X * 1e-19 joule units
cap_c = [2.43e-18, 4.8e-18, 1.245e-17]
cap_d = [2.4e-18, 7.3e-18, 2.5e-17]

[lj1]
name = "Lennard-Jones liquid (1-comp)"
symbol = "lj1"
component = ["LJ"]
valence = [0.0]
temperature = 298.15
concentration = [0.5]
epsilon_r = 1.0
index = 2
cr_filename = "lj1-cr.data"
status = "ready"

[lj1.potential]
type = "lj"
epsilon_lj = [0.1]
sigma_lj = [0.5]

[lj2]
name = "Lennard-Jones liquid (2-comp)"
symbol = "lj2"
component = ["1", "2"]
valence = [0.0, 0.0]
temperature = 298.15
concentration = [0.5, 0.5]
epsilon_r = 1.0
index = 5
cr_filename = "pyoz-cr-lj-equal-2-comp.data"
status = "ready"

[lj2.potential]
type = "lj"
epsilon_lj = [0.1, 0.1, 0.1]
sigma_lj = [0.5, 0.5, 0.5]

[h2o]
# CF1 central-force water (Haymet / Stillinger–Rahman family).
# Components ordered O, H so pair columns are OO, OH, HH.
name = "Liquid water (CF1)"
symbol = "h2o"
component = ["O", "H"]
valence = [-0.65966, 0.32983]  # q_O = -2 q_H, q_H = 0.32983 e
temperature = 298.15
# Number densities as mol/L of O and H sites at 1 g/cm^3 H2O
concentration = [55.508, 111.017]
epsilon_r = 1.0
index = 2
cr_filename = "h2o.cr.dat"
status = "experimental"  # bulk c from digitised thesis Fig 3.12; full OZ bulk still open

[h2o.potential]
type = "cf1"

[h2o.bulk]
# Prefer thesis digitised bulk c(r); n_points used when regenerating grids
n_points = 512
delta_r = 0.025
source = "digitised_fig3_12"

[2_2]
# Soft-core primitive-model 2:2 electrolyte in continuum water (epsilon_r = 78.3).
name = "2-2 Aqueous electrolyte"
symbol = "2_2"
component = ["+2", "-2"]
valence = [2.0, -2.0]
temperature = 298.15
concentration = [1.0, 1.0]
epsilon_r = 78.3
index = 5
cr_filename = "2_2.cr.dat"
status = "experimental"  # Ng/PY bulk path like KCl; wall smoke only

[2_2.potential]
type = "ionic"
n_outer_shell = [8.0, 8.0]
alpha = 2.967359050445104
b = 3.38e-20
sigma = [2.1, 2.1]
cap_c = [1.0e-18, 1.0e-18, 1.0e-18]
cap_d = [1.0e-18, 1.0e-18, 1.0e-18]

[2_2.bulk]
n_points = 512
delta_r = 0.05
closure = "py"
epsilon_kJ_mol = 1.0
mix = 0.08
ng_alpha = 1.2
max_iter = 2000
tol = 1.0e-5

[lj1.bulk]
# Match historical pyoz nrcg-lj-1comp (sigma 0.5 nm, eps 0.1 kJ/mol)
sigma_A = 5.0
epsilon_kJ_mol = 0.1
n_points = 1024
delta_r = 0.05
closure = "hnc"

[kcl.bulk]
n_points = 512
delta_r = 0.05
closure = "py"
# Soft LJ core (kJ/mol) + Ng mixing for melt-density ionic OZ
epsilon_kJ_mol = 5.0
mix = 0.03
ng_alpha = 1.2
max_iter = 3000
tol = 1.0e-5

[lj2.bulk]
sigma_A = 5.0
epsilon_kJ_mol = 0.1
n_points = 1024
delta_r = 0.05
closure = "hnc"

[1_1]
# Soft-core primitive-model 1:1 aqueous electrolyte (Booth et al. JCP 1995 family).
name = "1-1 Aqueous electrolyte"
symbol = "1_1"
component = ["+", "-"]
valence = [1.0, -1.0]
temperature = 298.15
concentration = [1.0, 1.0]
epsilon_r = 78.3
index = 4
cr_filename = "1_1.cr.dat"
status = "experimental"

[1_1.potential]
type = "ionic"
n_outer_shell = [8.0, 8.0]
alpha = 2.967359050445104
b = 3.38e-20
# Typical hydrated ion size scale (A)
sigma = [2.5, 2.5]
cap_c = [5.0e-19, 5.0e-19, 5.0e-19]
cap_d = [5.0e-19, 5.0e-19, 5.0e-19]

[1_1.bulk]
n_points = 512
delta_r = 0.05
closure = "hnc"
epsilon_kJ_mol = 0.5
mix = 0.15
ng_alpha = 1.2
max_iter = 2000
tol = 1.0e-6
