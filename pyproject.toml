[project]
name = "PhD-Thesis"
version = "0.1.0"
description = "PhD. Thesis - reimplementation Python Project - Michael J. Booth"
authors = [
    {name = "Michael Booth", email = "michael@databooth.com.au"},
]

requires-python = "==3.11.*"
readme = "README.md"
license = {text = "MIT"}
dependencies = [
    "streamlit>=1.37.1",
    "watchdog>=4.0.2",
    "plotly>=5.23.0",
    "scipy>=1.14.0",
    "matplotlib>=3.9.2",
]

[tool.pdm]
distribution = false
[tool.pdm.dev-dependencies]

notebook = [
    "notebook>=7.2.1",
]
lint = [
    "black[jupyter]>=24.8.0",
]
