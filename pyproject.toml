[project]
name = "phd-thesis"
version = "0.2.0"
description = "Charged fluids near interfaces: integral equation theory (PhD thesis reimplementation)"
authors = [
    { name = "Michael Booth", email = "michael@databooth.com.au" },
]
requires-python = ">=3.14,<3.15"
readme = "README.md"
license = { text = "MIT" }

# Core science library — no Streamlit (keeps tests/install free of pyarrow builds)
dependencies = [
    "numpy>=2.0.1",
    "scipy>=1.14.0",
    "pandas>=2.2.2",
    "psutil>=7.1.0",
    "loguru>=0.7.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.11.0",
    "ty>=0.0.1",
    "prek>=0.2.0",
]
app = [
    "streamlit>=1.41.0",
    "watchdog>=4.0.2",
    "plotly>=5.23.0",
    "matplotlib>=3.9.2",
    "duckdb>=1.0.0",
    # Binary wheels on Python 3.14 (avoid Arrow CMake source builds of older pins)
    "pyarrow>=26.0.0",
]
notebook = [
    "marimo>=0.13.0",
    "ipython>=8.21.0",
    "plotly>=5.23.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/charged_fluids"]

[tool.uv]
default-groups = ["dev", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "slow: longer-running numerical solves",
    "regression: known physical/behavioural gaps tracked until fixed",
]

[tool.coverage.run]
source = ["charged_fluids"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src/charged_fluids", "tests"]
extend-exclude = [
    "src/oo_refactoring",
    "src/bulk",
    "src/pyoz",
    "notebooks",
    "docs",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF",
]
ignore = [
    "E501",  # line length handled by formatter
    "E741",  # ambiguous name l — historical pair index in thesis code
    "SIM108",  # ternary style; prefer explicit branches in numerics
]

[tool.ruff.lint.isort]
known-first-party = ["charged_fluids"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src/charged_fluids", "tests"]
exclude = [
    "src/oo_refactoring/**",
    "src/bulk/**",
    "src/pyoz/**",
    "src/pages/**",
    "notebooks/**",
]
