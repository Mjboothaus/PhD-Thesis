[project]
name = "PhD-Thesis"
version = "0.1.0"
description = "PhD. Thesis - reimplementation Python Project - Michael J. Booth"
authors = [
    {name = "Michael Booth", email = "michael@databooth.com.au"},
]

requires-python = ">=3.13"
readme = "README.md"
license = {text = "MIT"}

# Core dependencies for the Streamlit app
dependencies = [
    "streamlit>=1.37.1",
    "watchdog>=4.0.2",
    "plotly>=5.23.0",
    "scipy>=1.14.0",
    "numpy>=2.0.1",
    "pandas>=2.2.2",
    "matplotlib>=3.9.2",
    "duckdb>=1.0.0",
    "psutil>=7.1.0",
    "loguru>=0.7.3",
]

[project.optional-dependencies]
# Dependencies for development and testing
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "black>=24.1.1",
    "isort>=5.13.2",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
]

# Dependencies for Jupyter notebook support
notebook = [
    "notebook>=7.0.0",
    "ipython>=8.21.0",
    "jupyterlab>=4.1.0",
]

# Dependencies for documentation
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings>=0.24.0",
]

# All optional dependencies
all = ["PhD-Thesis[dev,notebook,docs]"]
