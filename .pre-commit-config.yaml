# prek-compatible pre-commit configuration
# Install hooks: uv run prek install
# Run all:      uv run prek run --all-files

repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.107
    hooks:
      - id: ty
        args: [--isolated]
